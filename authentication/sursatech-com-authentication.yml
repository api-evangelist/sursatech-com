protected_resources:
- resource: https://api.sursatech.com/api/a2a
  metadata: https://api.sursatech.com/.well-known/oauth-protected-resource
  bearer_methods_supported: [header]
  challenge: 'WWW-Authenticate: Bearer realm="SursaTech A2A", resource_metadata="https://api.sursatech.com/.well-known/oauth-protected-resource" (observed on an anonymous POST, HTTP 401 {"detail":"Missing bearer token"})'
- resource: https://www.sursatech.com
  metadata: https://www.sursatech.com/.well-known/oauth-protected-resource
  note: the website origin declares itself a protected resource of the same authorization server; the API resource document on api.sursatech.com is the operative one for the A2A endpoint
flows:
- name: Anonymous self-registration
  documented_at: https://api.sursatech.com/auth.md
  steps:
  - 'POST https://api.sursatech.com/api/a2a/register with Content-Type: application/json and body {"name": "Your agent name"}'
  - 'Response (per auth.md): tokenType "Bearer" and accessToken; observed response fields on 2026-09-19: clientId (UUID), name, tokenType, accessToken, rateLimitPerMinute (60). An EMPTY body is accepted and a default name is assigned.'
  - The plaintext token is returned only once; store it securely.
  - 'Send Authorization: Bearer <accessToken> on POST https://api.sursatech.com/api/a2a'
  token_scope: self-registration tokens receive the A2A agent scope (a2a) and are rate-limited per client and per IP
- name: Token endpoint
  documented_at: https://api.sursatech.com/.well-known/oauth-authorization-server (token_endpoint) and the card's x-sursatech-tokenUrl
  steps:
  - 'POST https://api.sursatech.com/api/a2a/token — observed on 2026-09-19 to answer an anonymous EMPTY JSON body with HTTP 200 {access_token, token_type "Bearer", scope "a2a", client_id} (RFC 6749 §5.1 field names, unlike /register)'
  note: auth.md does not document the token endpoint's request shape; the discovery metadata lists client_credentials with auth method none, and the empty-body probe confirms no client credential is required to mint an a2a-scoped token.
- name: Partner credentials
  documented_at: a2a/sursatech-com-agent-card.json#securitySchemes.bearerAuth.description
  note: tokens "minted out-of-band for known partners" — no public flow; presumably the path to company.read / requirements.write / booking.write scopes beyond the default a2a scope
revocation:
  self_service: false
  note: 'auth.md: "There is no self-service revocation endpoint yet. Contact info@sursatech.com to disable a registered agent credential."'
  contact: info@sursatech.com
error_behaviour:
  missing_token:
    status: 401
    body: '{"detail":"Missing bearer token"}'
    headers:
      www-authenticate: Bearer realm="SursaTech A2A", resource_metadata="https://api.sursatech.com/.well-known/oauth-protected-resource"
  note: The unauthenticated challenge fires before JSON-RPC method dispatch for the A2A 1.0 method names (SendMessage, GetTask); unknown method names return JSON-RPC -32601 with HTTP 200 without an auth check.
provenance_note: 'This profile used no credential: it records the anonymous probes only. The tokens the empty-body probes returned were discarded and never sent to the API.'
