human_in_the_loop:
  note: 'The card and auth.md state repeatedly that user-impacting steps require normal verification and payment-provider checks; llms.txt goes further: "Booking, payment, and calendar flows require human consent and live behind the website chat" — i.e. the provider positions the A2A surface as read-mostly for third-party agents even though the six write skills are listed on the card.'
