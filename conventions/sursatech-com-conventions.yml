generated: '2026-09-19'
method: searched
source: https://api.sursatech.com/auth.md, the agent card (a2a/sursatech-com-agent-card.json — skill descriptions carry the guard rails), https://www.sursatech.com/llms.txt, the discovery documents in well-known/, and live anonymous probes of https://api.sursatech.com on 2026-09-19. No OpenAPI exists to derive from.
description: 'How the SursaTech AI Advisor A2A API behaves: a single JSON-RPC 2.0 endpoint behind an opaque bearer token that any agent can mint anonymously, ten skills of which six mutate (lead capture, booking, payment, confirmation, cancel/reschedule) behind stated human-verification and payment-provider gates, no idempotency contract, no pagination, no versioning scheme, FastAPI/JSON-RPC error envelopes, and per-client + per-IP rate limits that are stated but not signalled in headers.'
base_url: https://api.sursatech.com/api/a2a
api_style: A2A 1.0 over JSON-RPC 2.0 (HTTP POST, protocolBinding JSONRPC); streaming declared (capabilities.streaming true); text/plain in, text/plain or application/json out
protocol_note: 'Only the A2A 1.0 method names are implemented (SendMessage / GetTask reach the auth gate); the 0.3-era message/send and tasks/get return -32601. The card nevertheless carries the 0.3 fields (url, preferredTransport, additionalInterfaces) for older resolvers.'
authentication:
  scheme: 'Opaque bearer token — Authorization: Bearer <accessToken>'
  acquisition: 'Anonymous self-registration: POST /api/a2a/register {"name": "…"} returns the token once; POST /api/a2a/token also mints an a2a-scoped token with no client credential (observed). Partner tokens are minted out-of-band.'
  scopes: [a2a, company.read, requirements.write, booking.write]
  default_scope: a2a
  revocation: none self-service — email info@sursatech.com
  discovery: RFC 8414 + OIDC metadata on api.sursatech.com and www.sursatech.com; RFC 9728 resource metadata on the endpoint host, echoed in the 401 WWW-Authenticate challenge
  docs: https://api.sursatech.com/auth.md
  detail: authentication/sursatech-com-authentication.yml
  scopes_detail: scopes/sursatech-com-scopes.yml
idempotency:
  supported: false
  coverage: none
  mechanism: null
  scope: []
  note: 'No idempotency key, request id or replay guarantee is documented anywhere on the surface. The write skills are gated by human verification ("Requires user email and selected time before payment", "Confirm the booking only after payment has been verified by the configured provider/webhook", "verification is required before calendar mutation") — these are consent gates, not idempotency, and a retried SendMessage that captures a lead or starts a booking has no documented dedupe.'
dry_run_mode:
  supported: false
  note: No dry-run, preview or sandbox mode is documented. The estimate_project_timeline_and_price skill returns a "tentative" estimate but that is a read, not a rehearsal of a write.
reversibility:
  grade: documented
  write_surface:
  - skill: capture_lead_requirement
    effect: persists a structured project requirement for human follow-up
    reversal: none documented
    window: null
  - skill: start_consultation_booking
    effect: starts or continues a booking (requires user email + selected time before payment)
    reversal: cancel_or_reschedule_booking
    window: null
  - skill: create_payment_checkout
    effect: creates and returns a consultation payment checkout link
    reversal: none documented (no refund or void skill; payment "still runs through the normal backend workflow" per auth.md)
    window: null
  - skill: confirm_paid_booking
    effect: confirms the booking after payment is verified by the provider/webhook
    reversal: cancel_or_reschedule_booking
    window: null
  - skill: cancel_or_reschedule_booking
    effect: starts a guarded cancel/reschedule flow for an existing booking; verification is required before calendar mutation
    reversal: n/a (this IS the reversal path)
    window: null
  reversal_operations:
  - operationId: cancel_or_reschedule_booking
    kind: cancel / reschedule
    applies_to: [start_consultation_booking, confirm_paid_booking]
    source: a2a/sursatech-com-agent-card.json#skills[cancel_or_reschedule_booking]
    docs: https://www.sursatech.com/.well-known/agent-card.json
  window_note: 'The provider publishes NO cancellation, reschedule or refund window anywhere (no terms page — /terms 404; auth.md and the card state only that verification precedes calendar mutation). A reversal path exists for bookings, so the grade is documented (0.4), not verified — no window is asserted because none is stated.'
  payments_note: No refund/void path is documented for a checkout created by create_payment_checkout; an agent should treat payment as irreversible from this surface.
