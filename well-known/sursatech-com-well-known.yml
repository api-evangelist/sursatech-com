summary:
  hosts_probed: 4
  paths_probed: 60
  documents_served: 12
  hit_count: 8
  note: 'SursaTech serves a complete agent-discovery surface across two hosts. www.sursatech.com (the website) serves the A2A agent card, OIDC discovery, RFC 8414 authorization-server metadata, RFC 9728 protected-resource metadata (resource = the website origin), an RFC 9727 api-catalog linkset, a JWKS and an agentskills.io skill index. api.sursatech.com (the A2A endpoint) serves the same card byte-for-byte, its own OIDC/RFC 8414 metadata (identical content, minified), its own RFC 9728 document (resource = https://api.sursatech.com/api/a2a — the correct RFC 9728 placement on the resource server) and a JWKS. The apex sursatech.com 308-redirects every path to www and serves nothing of its own. analytics.apps.sursatech.com 404s everything. No security.txt on any host (neither /.well-known nor root), no apis.json, no ai-plugin.json, no ucp/acp/aauth, no mcp.json. Two weaknesses worth recording: the api-catalog''s service-desc link (https://api.sursatech.com/openapi.json) 404s — the catalog advertises an OpenAPI that is not served — and both JWKS documents are empty ({"keys":[]}), consistent with the card''s opaque bearer tokens but meaning nothing can be verified offline.'
  auth_model_note: 'The OAuth metadata describes an ANONYMOUS dynamic-registration model rather than an interactive OAuth flow: grant_types_supported [client_credentials], token_endpoint_auth_methods_supported [none], response_types_supported [none], authorization_endpoint pointing at a markdown document (auth.md) rather than an authorization UI, and a non-standard agent_auth block (identity_types_supported [anonymous], register_uri / claim_uri = /api/a2a/register). See authentication/ and scopes/.'
  mcp_host_note: 'The provider advertises no MCP server anywhere (card, llms.txt, auth.md, api-catalog). A POST to https://api.sursatech.com/api/mcp answers 401 with the same WWW-Authenticate: Bearer … resource_metadata challenge as /api/a2a (GET 405), so a bearer-gated route exists at that path, but whether it speaks MCP could not be established without credentials — see mcp/. The api.sursatech.com rows above therefore already cover the only candidate MCP host.'
