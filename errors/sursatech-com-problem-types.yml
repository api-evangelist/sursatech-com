problems:
- status: 401
  layer: http
  title: Missing bearer token
  detail: '{"detail":"Missing bearer token"}'
  remediation: 'Register anonymously (POST /api/a2a/register) or mint a token (POST /api/a2a/token) and send Authorization: Bearer <accessToken>. Follow the resource_metadata URL in WWW-Authenticate for the authorization server.'
- status: 404
  layer: http
  title: Not Found
  detail: '{"detail":"Not Found"}'
  remediation: Only /api/a2a, /api/a2a/register, /api/a2a/token, /health, /auth.md and the /.well-known documents are served on api.sursatech.com.
- status: 405
  layer: http
  title: Method Not Allowed
  detail: '{"detail":"Method Not Allowed"}'
  remediation: The A2A endpoint and the registration/token endpoints accept POST only.
- status: 200
  layer: json-rpc
  code: -32601
  title: Method not found
  detail: '{"jsonrpc":"2.0","id":1,"error":{"code":-32601,"message":"Method not found"}}'
  remediation: Use the A2A 1.0 method names (SendMessage, GetTask, …); the 0.3-era message/send family is not implemented.
not_observed:
- JSON-RPC -32600 / -32602 / -32700 (invalid request / params / parse) — require an authenticated call to reach the dispatcher's validation
- A2A application errors (-32001 TaskNotFound and siblings)
- 403 (wrong scope), 429 (rate limit) — auth.md states per-client and per-IP limits but the exhaustion response is undocumented
