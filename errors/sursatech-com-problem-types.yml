    headers:
      www-authenticate: Bearer realm="SursaTech A2A", resource_metadata="https://api.sursatech.com/.well-known/oauth-protected-resource"
  POST /api/a2a (anonymous, method message/send, tasks/get, message/stream or agent/getAuthenticatedExtendedCard):
    status: 200
    body: '{"jsonrpc":"2.0","id":1,"error":{"code":-32601,"message":"Method not found"}}'
    note: 0.3-era method names are not registered; dispatch happens before the auth check for unknown methods
  GET /api/a2a, GET /api/a2a/register, GET /api/a2a/token, GET /api/mcp:
