source: 'Observed on anonymous requests to https://api.sursatech.com on 2026-09-19 (there is no OpenAPI to derive from and no error reference page). Two envelopes coexist: the FastAPI HTTP layer returns {"detail": …}; the JSON-RPC 2.0 dispatcher returns a JSON-RPC error object with HTTP 200. Application-level A2A errors (task not found, unsupported operation, etc.) require an authenticated call and were not observed.'
envelope:
  media_type: application/json
  rfc9457: false
  shapes:
  - layer: http
    shape: '{"detail": "<prose>"}'
    note: FastAPI default; no code field, no type URI, no request id
  - layer: json-rpc
    shape: '{"jsonrpc": "2.0", "id": <id>, "error": {"code": <int>, "message": "<prose>"}}'
    note: HTTP status is 200 for JSON-RPC-level errors; switch on error.code
observed:
