description: 'SursaTech publishes no API pricing: the A2A surface has a single access model — anonymous self-registration for a bearer token at no charge, rate-limited per client (60/min observed) and per IP, with the a2a scope; partner tokens with wider scopes are "minted out-of-band". The /pricing page prices the company''s consulting ENGAGEMENTS, not the API: "SursaTech does not publish fixed rates. Engagements fall into three shapes" — Spike (1 to 4 weeks), Build (3 to 6 months, monthly retainer, weekly demos) and Operate (6+ months, monthly retainer) — and says the fastest path to a firm number is a paid consultation booked through the advisor. No prices, currency or quotas are stated for any of the three.'
