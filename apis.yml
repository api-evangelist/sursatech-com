apis:
- aid: sursatech-com:sursatech-ai-advisor-a2a-api
  name: SursaTech AI Advisor A2A API
  description: 'An A2A 1.0 agent (JSON-RPC 2.0 over HTTP POST, streaming declared) exposing ten skills: get_company_profile,
    get_services, get_portfolio_projects, get_development_process, estimate_project_timeline_and_price,
    capture_lead_requirement, start_consultation_booking, create_payment_checkout, confirm_paid_booking and
    cancel_or_reschedule_booking. Authentication is an opaque bearer token any agent can mint anonymously at
    POST /api/a2a/register (or /api/a2a/token) with the a2a scope, rate-limited per client (60/min observed) and per IP;
    company.read, requirements.write and booking.write scopes are published but only issued out-of-band to partners.
    Only the A2A 1.0 method names (SendMessage, GetTask) are implemented; the 0.3-era message/send family returns -32601.
    No OpenAPI is served — the api-catalog advertises one at /openapi.json that 404s — so the agent card is the contract.'
  image: https://www.sursatech.com/brand/apple-icon.png
  humanURL: https://api.sursatech.com/auth.md
  baseURL: https://api.sursatech.com/api/a2a
