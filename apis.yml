aid: sursatech-com
name: SursaTech
description: 'SursaTech (Sursa Technology Private Limited) is an AI-native product engineering and consulting company
  founded in 2017 in Kathmandu, Nepal, building production AI agents, RAG and knowledge systems, AI-enabled SaaS
  products, automation and integrations, and QA leadership for clients in Nepal, Japan, Norway, the United States and
  the United Kingdom, and operating its own products (Humafu, AcademyKit, Buy Me a Momo). Its public machine surface
  is an A2A 1.0 agent — the SursaTech AI Advisor — served as a conformant agent card at
  /.well-known/agent-card.json with a JSON-RPC endpoint at api.sursatech.com/api/a2a: ten skills covering company
  knowledge (profile, services, portfolio, process, pricing), lead-requirement capture, tentative project estimates
  and guarded consultation booking, payment and cancel/reschedule flows. Any agent can self-register anonymously for
  an opaque bearer token; the provider publishes RFC 8414/OIDC authorization-server metadata, RFC 9728
  protected-resource metadata, an RFC 9727 api-catalog, an agentskills.io skill index and an llms.txt, but no
  OpenAPI, SDK, MCP server, status page, pricing for the API, or legal pages.'
