agent_card:
  name: SursaTech AI Advisor
  description: 'SursaTech AI Advisor for an AI-native product engineering company in Kathmandu, Nepal, founded in 2017. Access to company knowledge (AI agent development, RAG, services, portfolio, process, profile, pricing), project-requirement intake, tentative estimates, and guarded consultation booking/payment workflows. Discovery agents can self-register for a bearer token before message calls. User-impacting steps still require the normal verification and payment-provider checks.'
  version: 1.0.0
  protocol_version: '1.0'
  url: https://api.sursatech.com/api/a2a
  preferred_transport: JSONRPC
  supported_interfaces:
  - url: https://api.sursatech.com/api/a2a
    protocolBinding: JSONRPC
    protocolVersion: '1.0'
  provider:
    organization: SursaTech
    url: https://www.sursatech.com
  capabilities:
    streaming: true
  default_input_modes:
  - text/plain
  default_output_modes:
  - text/plain
  - application/json
  security_schemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque
      description: Opaque bearer token returned by /api/a2a/register or /api/a2a/token, or minted out-of-band for known partners.
  security:
  - bearerAuth: []
  registration_url: https://api.sursatech.com/api/a2a/register
  token_url: https://api.sursatech.com/api/a2a/token
  skill_count: 10
  skills:
  - id: get_company_profile
    name: Get company profile
    kind: read
    tags: [company, profile, ai-company, contact]
  - id: get_services
    name: Get services
    kind: read
    tags: [services, ai-agent-development, rag, ai-product-engineering, qa-automation]
  - id: get_portfolio_projects
    name: Get portfolio
    kind: read
    tags: [portfolio, case-studies, projects]
  - id: get_development_process
    name: Get development process
    kind: read
    tags: [process, delivery, consulting]
  - id: capture_lead_requirement
    name: Capture lead requirement
    kind: write
    tags: [requirements, lead-capture, handoff]
  - id: estimate_project_timeline_and_price
    name: Estimate project
    kind: read
    tags: [estimate, timeline, pricing]
  - id: start_consultation_booking
    name: Start consultation booking
    kind: write
    guard: Requires user email and selected time before payment.
    tags: [booking, consultation, calendar]
  - id: create_payment_checkout
    name: Create payment checkout
    kind: write
    guard: Only once booking details are collected.
    tags: [payment, checkout, booking]
  - id: confirm_paid_booking
    name: Confirm paid booking
    kind: write
    guard: Confirm the booking only after payment has been verified by the configured provider/webhook.
    tags: [payment, verification, calendar]
  - id: cancel_or_reschedule_booking
    name: Cancel or reschedule booking
    kind: write (reversal)
    guard: Verification is required before calendar mutation.
    tags: [booking, reschedule, cancel]
  skill_kind_note: 'kind is this profile''s reading of each skill description (read = returns company knowledge; write = persists or mutates a lead, booking or payment), not a field on the card. The four "knowledge" skills plus the estimate map onto the agentskills.io index the provider publishes at /.well-known/agent-skills/index.json (see skills/).'
